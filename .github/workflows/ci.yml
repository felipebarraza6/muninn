name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://api.yggdra.cl/api
          VITE_BASE_PATH: /

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build (GitHub Pages / staging)
        run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING || 'https://api.yggdra.cl/api' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_ENV: staging

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-ftp-agencia:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-agencia
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build (Agencia Patagonia)
        run: bun run build
        env:
          VITE_API_URL: https://api.agenciapatagoniachile.com/api
          VITE_BASE_PATH: /
          VITE_APP_ENV: production

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_AGENCIA }}
          username: ${{ secrets.FTP_USER_AGENCIA }}
          password: ${{ secrets.FTP_PASS_AGENCIA }}
          local-dir: ./dist/
          server-dir: ./agents.agenciapatagoniachile.com/
          dangerous-clean-slate: false

  deploy-ftp-void:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-void
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build (Void Smarthydro)
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_VOID }}
          VITE_BASE_PATH: /
          VITE_APP_ENV: production

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_VOID }}
          username: ${{ secrets.FTP_USER_VOID }}
          password: ${{ secrets.FTP_PASS_VOID }}
          local-dir: ./dist/
          server-dir: ./void.smarthydro.app/
          dangerous-clean-slate: false

  deploy-ftp-muninn:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-muninn
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build (Muninn Yggdra)
        run: bun run build
        env:
          VITE_API_URL: https://api.yggdra.cl/api
          VITE_BASE_PATH: /
          VITE_APP_ENV: production

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_MUNINN }}
          username: ${{ secrets.FTP_USER_MUNINN }}
          password: ${{ secrets.FTP_PASS_MUNINN }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
