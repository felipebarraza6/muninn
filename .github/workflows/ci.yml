name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

env:
  VITE_API_URL: https://api.agenciapatagoniachile.com/api

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  deploy-gh-pages:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (GH Pages)
        run: bun run build
        env:
          VITE_BASE_PATH: /muninn/

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-ftp-agencia:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Agencia Patagonia)
        run: bun run build
        env:
          VITE_API_URL: https://api.agenciapatagoniachile.com/api
          VITE_BASE_PATH: /

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_AGENCIA }}
          username: ${{ secrets.FTP_USER_AGENCIA }}
          password: ${{ secrets.FTP_PASS_AGENCIA }}
          local-dir: ./dist/
          server-dir: ./agents.agenciapatagoniachile.com/
          dangerous-clean-slate: false

  deploy-ftp-void:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Void Smarthydro)
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_VOID }}
          VITE_BASE_PATH: /

      - name: Copy 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_VOID }}
          username: ${{ secrets.FTP_USER_VOID }}
          password: ${{ secrets.FTP_PASS_VOID }}
          local-dir: ./dist/
          server-dir: ./void.smarthydro.app/
          dangerous-clean-slate: false
