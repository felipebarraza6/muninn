name: CI status issues

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ci-status-issues-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  sync-issue:
    if: >
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Abrir, comentar o cerrar issue
        uses: actions/github-script@v7
        with:
          script: |
            const { handleWorkflowRun } = require('./.github/scripts/ci-status-issues.cjs');
            await handleWorkflowRun({ github, context, core });
